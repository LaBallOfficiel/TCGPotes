<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCGPotes — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --panel:    #1a1a24;
    --border:   #2a2a3a;
    --accent:   #7c5cfc;
    --accent2:  #f43f8e;
    --gold:     #f59e0b;
    --green:    #22c55e;
    --red:      #ef4444;
    --orange:   #f97316;
    --text:     #f0f0ff;
    --muted:    #7070a0;
    --mono:     'Space Mono', monospace;
    --sans:     'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px;
    opacity: 0.4;
  }

  /* ── LOGIN ── */
  #loginScreen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .login-box {
    width: min(400px, 90vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    position: relative;
    overflow: hidden;
  }
  .login-box::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .login-logo {
    font-family: var(--sans); font-size: 28px; font-weight: 800;
    letter-spacing: -1px; margin-bottom: 6px;
  }
  .login-logo span { color: var(--accent); }
  .login-sub { color: var(--muted); font-size: 13px; margin-bottom: 32px; font-family: var(--mono); }
  .login-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .login-input {
    width: 100%; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--mono); font-size: 14px;
    outline: none; transition: border-color .2s;
    margin-bottom: 20px;
  }
  .login-input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 13px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-family: var(--sans); font-size: 15px; font-weight: 700;
    cursor: pointer; transition: opacity .2s;
  }
  .login-btn:hover { opacity: .85; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 12px; font-family: var(--mono); min-height: 18px; }

  /* ── MAIN LAYOUT ── */
  #adminApp { display: none; min-height: 100vh; position: relative; z-index: 1; }
  #adminApp.visible { display: flex; flex-direction: column; }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .top-bar-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .top-bar-title span { color: var(--accent); }
  .top-bar-badge {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px;
  }
  .top-bar-right { display: flex; align-items: center; gap: 12px; }
  .btn-logout {
    padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: var(--mono); font-size: 12px;
    cursor: pointer; transition: all .2s;
  }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  .main-content { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; }

  /* ── STATS ROW ── */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; position: relative; overflow: hidden;
  }
  .stat-card::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  }
  .stat-card.blue::after  { background: var(--accent); }
  .stat-card.pink::after  { background: var(--accent2); }
  .stat-card.gold::after  { background: var(--gold); }
  .stat-card.green::after { background: var(--green); }
  .stat-card.red::after   { background: var(--red); }
  .stat-val { font-size: 32px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
  .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-family: var(--mono); }

  /* ── SEARCH & FILTERS ── */
  .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 220px; padding: 10px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--mono); font-size: 13px; outline: none;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-btn {
    padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-family: var(--mono); font-size: 12px;
    cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(124,92,252,.1); }

  /* ── PLAYER TABLE ── */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-header {
    display: grid;
    grid-template-columns: 48px 1fr 110px 90px 90px 90px 100px 140px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--muted);
    text-transform: uppercase; font-family: var(--mono);
  }
  .player-row {
    display: grid;
    grid-template-columns: 48px 1fr 110px 90px 90px 90px 100px 140px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    align-items: center; transition: background .15s; cursor: pointer;
  }
  .player-row:last-child { border-bottom: none; }
  .player-row:hover { background: var(--panel); }
  .player-row.banned { opacity: .5; }
  .player-avatar { font-size: 24px; line-height: 1; }
  .player-info .pseudo { font-size: 14px; font-weight: 700; }
  .player-info .uid   { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .player-info .code  { font-size: 11px; color: var(--accent); font-family: var(--mono); }
  .num-cell { font-family: var(--mono); font-size: 13px; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700;
    font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em;
  }
  .status-active  { background: rgba(34,197,94,.15); color: var(--green); border: 1px solid rgba(34,197,94,.3); }
  .status-banned  { background: rgba(239,68,68,.15);  color: var(--red);   border: 1px solid rgba(239,68,68,.3); }
  .status-tempban { background: rgba(249,115,22,.15); color: var(--orange);border: 1px solid rgba(249,115,22,.3); }
  .actions-cell { display: flex; gap: 6px; }
  .act-btn {
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: var(--mono); font-size: 11px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .act-btn:hover { border-color: var(--accent); color: var(--accent); }
  .act-btn.red:hover { border-color: var(--red); color: var(--red); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    width: min(600px, 100%); max-height: 90vh; overflow-y: auto;
    position: relative;
  }
  .modal-header {
    padding: 24px 28px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0;
    background: var(--surface); z-index: 1;
  }
  .modal-title { font-size: 18px; font-weight: 800; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }
  .modal-body { padding: 24px 28px; }
  .modal-player-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .modal-avatar { font-size: 48px; }
  .modal-player-name { font-size: 22px; font-weight: 800; }
  .modal-player-meta { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }

  /* ── FORM ELEMENTS ── */
  .form-section { margin-bottom: 24px; }
  .form-section-title {
    font-size: 10px; font-weight: 700; letter-spacing: .15em; color: var(--muted);
    text-transform: uppercase; font-family: var(--mono); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .form-input, .form-select, .form-textarea {
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: 13px;
    outline: none; transition: border-color .2s; width: 100%;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-select option { background: var(--panel); }
  .form-textarea { resize: vertical; min-height: 80px; }

  /* ── AVATAR PICKER ── */
  .avatar-grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    max-height: 160px; overflow-y: auto;
  }
  .avatar-opt {
    font-size: 22px; text-align: center; padding: 6px; border-radius: 8px;
    border: 2px solid transparent; cursor: pointer; transition: all .15s;
  }
  .avatar-opt:hover { background: var(--panel); }
  .avatar-opt.selected { border-color: var(--accent); background: rgba(124,92,252,.15); }

  /* ── CARDS MANAGER ── */
  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px;
    max-height: 200px; overflow-y: auto;
  }
  .card-chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 4px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); cursor: pointer; transition: all .15s; font-size: 10px;
    font-family: var(--mono); color: var(--muted);
  }
  .card-chip.owned { border-color: var(--accent); color: var(--accent); background: rgba(124,92,252,.1); }
  .card-chip-num { font-size: 11px; font-weight: 700; }
  .card-chip-rarity { font-size: 9px; }

  /* ── BAN HISTORY ── */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    padding: 12px 14px; background: var(--panel); border-radius: 8px;
    border-left: 3px solid var(--border);
    font-size: 12px; font-family: var(--mono);
  }
  .history-item.ban  { border-left-color: var(--red); }
  .history-item.tempban { border-left-color: var(--orange); }
  .history-item.unban { border-left-color: var(--green); }
  .history-item.edit  { border-left-color: var(--accent); }
  .history-date { color: var(--muted); font-size: 10px; margin-top: 4px; }

  /* ── MODAL FOOTER ── */
  .modal-footer {
    padding: 16px 28px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; justify-content: flex-end;
    position: sticky; bottom: 0; background: var(--surface);
  }
  .btn { padding: 10px 20px; border-radius: 8px; border: none; font-family: var(--sans); font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .btn-cancel { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .btn-cancel:hover { color: var(--text); }
  .btn-save   { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-save:hover { opacity: .85; }
  .btn-ban    { background: var(--red); color: #fff; }
  .btn-unban  { background: var(--green); color: #fff; }

  /* ── LOADING ── */
  .loading-state { text-align: center; padding: 60px; color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 24px; font-size: 14px; font-family: var(--mono);
    z-index: 999; transition: transform .3s; box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── CHARGES DISPLAY ── */
  .charges-display { display: flex; align-items: center; gap: 6px; }
  .charge-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .charge-dot.full { background: var(--accent); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">TCG<span>Potes</span></div>
    <div class="login-sub">// panel d'administration</div>
    <div class="login-label">Mot de passe admin</div>
    <input type="password" id="adminPass" class="login-input" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Accéder au panel →</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:16px">
      <div class="top-bar-title">TCG<span>Potes</span> Admin</div>
      <div class="top-bar-badge" id="topBadge">— joueurs</div>
    </div>
    <div class="top-bar-right">

  <div class="main-content">

      <div class="stat-card gold"><div class="stat-val" id="sCards">—</div><div class="stat-lbl">Cartes totales</div></div>
      <div class="stat-card pink"><div class="stat-val" id="sPacks">—</div><div class="stat-lbl">Boosters ouverts</div></div>

      <input type="text" class="search-input" id="searchInput" placeholder="🔍  Rechercher pseudo, code, UID…" oninput="filterPlayers()">
      <button class="filter-btn active" id="fAll"    onclick="setFilter('all')">Tous</button>
      <button class="filter-btn"        id="fActive" onclick="setFilter('active')">Actifs</button>

    <!-- TABLE -->
    <div class="table-wrap">
      <div class="table-header">
        <div></div>
        <div>Joueur</div>
        <div>Code ami</div>
        <div>Cartes</div>
        <div>Boosters</div>
        <div>Recharges</div>
        <div>Statut</div>
        <div>Actions</div>
      </div>
      <div id="playersList"><div class="loading-state"><div class="spinner"></div><br>Chargement…</div></div>
    </div>
  </div>
</div>

<!-- MODAL JOUEUR -->
<div class="modal-overlay" id="playerModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Modifier le joueur</div>
      <button class="modal-close" onclick="closeModal()">✕</button>

    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

const FIREBASE_CONFIG={apiKey:"AIzaSyALLbAdXoT3-Vbcy82n1W__yIjdRpsCwZQ",authDomain:"tcgpotes-525e0.firebaseapp.com",projectId:"tcgpotes-525e0",storageBucket:"tcgpotes-525e0.firebasestorage.app",messagingSenderId:"259521841130",appId:"1:259521841130:web:ec723c4ca9f1d1987cd493"};

// !! CHANGE CE MOT DE PASSE !!
// Il est haché avec SHA-256. Pour générer un nouveau hash :
// Ouvre une console JS et tape : await crypto.subtle.digest('SHA-256', new TextEncoder().encode('TON_MOT_DE_PASSE'))

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// ── RARITÉS ───────────────────────────────────────────────
const LYCEE_RARITIES={1:'basique',2:'basique',3:'basique',4:'basique',5:'basique',6:'basique',7:'basique',8:'basique',9:'basique',10:'basique',11:'rare',12:'rare',13:'rare',14:'rare',15:'rare',16:'rare',17:'rare',18:'rare',19:'rare',20:'rare',21:'fullart',22:'fullart',23:'fullart',24:'fullart',25:'fullart',26:'gold',27:'gold',28:'basique',29:'basique',30:'basique',31:'basique',32:'basique',33:'basique',34:'basique',35:'basique',36:'rare',37:'rare',38:'rare',39:'rare',40:'rare',41:'rare',42:'fullart',43:'fullart',44:'fullart',45:'fullart',46:'fullart'};
const RARITY_EMOJI={basique:'🎴',rare:'💎',fullart:'🌟',gold:'👑'};
const AVATARS=['😀','😎','🤩','😈','🥷','🤠','👻','💀','🤖','👾','🦊','🐱','🐸','🦄','🐲','🐺','🦁','🐯','🐻','🐼','🦋','🐙','🦈','🦅','🦉','🐬','🦎','🦖','🧙','🧜','🦸','🧚','🧝','🥸','🤺','🧛','🎩','🌈','🍀','⭐','🔥','💎','👑','⚡','🌙','🌸','🎭','🗡️','🛡️','🎯','🏆','💫','🌊','❄️'];

// ── LOGIN ─────────────────────────────────────────────────
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function tryLogin(){
  const pass = document.getElementById('adminPass').value;
  if(!pass){ document.getElementById('loginError').textContent = '⚠️ Entre le mot de passe'; return; }
  const hash = await sha256(pass);

  // Vérifier contre le hash dans Firestore /admin/config
  try{
    // Vérifier d'abord contre Firestore (lecture publique /admin/config)
    let ok = false;
    try{
      const snap = await db.collection('admin').doc('config').get();
      if(snap.exists){ ok = snap.data().passHash === hash; }
      else { ok = hash === ADMIN_PASS_HASH; }
    } catch(e){
      // Firestore inaccessible → fallback hash local
      ok = hash === ADMIN_PASS_HASH;
    }
    if(ok){
      isAdmin = true;
      sessionStorage.setItem('tcgp_admin', hash);
      showApp();
    } else {
      document.getElementById('loginError').textContent = '❌ Mot de passe incorrect';
      document.getElementById('adminPass').value = '';
    }
}

function checkSession(){
  const stored = sessionStorage.getItem('tcgp_admin');
  if(stored){
    // Revérifier contre Firestore
    db.collection('admin').doc('config').get().then(snap=>{
      const validHash = snap.exists ? snap.data().passHash : ADMIN_PASS_HASH;
      if(stored === validHash){ isAdmin=true; showApp(); }
    }).catch(()=>{
      if(stored === ADMIN_PASS_HASH){ isAdmin=true; showApp(); }
    });
  }
}

function doLogout(){
  sessionStorage.removeItem('tcgp_admin');
  isAdmin = false;
  document.getElementById('adminApp').classList.remove('visible');
  document.getElementById('loginScreen').style.display = 'flex';
}

// ── SHOW APP ──────────────────────────────────────────────
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').classList.add('visible');
  document.getElementById('topDate').textContent = new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  loadPlayers();
}

// ── LOAD ALL PLAYERS ──────────────────────────────────────
async function loadPlayers(){
  document.getElementById('playersList').innerHTML = '<div class="loading-state"><div class="spinner"></div><br>Chargement des joueurs…</div>';
  try{
    const snap = await db.collection('players').get();
    allPlayers = [];
    snap.forEach(doc => {
      allPlayers.push({ uid: doc.id, ...doc.data() });
    });
    updateStats();
    renderPlayers();
    showToast(`✅ ${allPlayers.length} joueurs chargés`);
  } catch(e){
    document.getElementById('playersList').innerHTML = `<div class="loading-state">❌ Erreur : ${e.message}<br><small>Vérifie les règles Firestore admin</small></div>`;
  }
}

function updateStats(){
  const banned = allPlayers.filter(p => p.banned);
  const tempBanned = allPlayers.filter(p => p.tempBanUntil && p.tempBanUntil > Date.now());
  const totalCards = allPlayers.reduce((s,p) => s + Object.keys(p.gameState?.collection||{}).length, 0);
  const totalPacks = allPlayers.reduce((s,p) => s + (p.packsOpened||0), 0);

  document.getElementById('sTotal').textContent  = allPlayers.length;
  document.getElementById('sActive').textContent = allPlayers.length - banned.length - tempBanned.length;
  document.getElementById('sBanned').textContent = banned.length + tempBanned.length;
  document.getElementById('sCards').textContent  = totalCards;
  document.getElementById('sPacks').textContent  = totalPacks;
  document.getElementById('topBadge').textContent = `${allPlayers.length} joueurs`;
}

function setFilter(f){
  currentFilter = f;
  ['all','active','banned'].forEach(id => {
    document.getElementById('f'+id.charAt(0).toUpperCase()+id.slice(1))?.classList.toggle('active', id===f);
  });
  renderPlayers();
}

function filterPlayers(){
  renderPlayers();
}

function getStatus(p){
  if(p.banned) return {type:'banned', label:'Banni', cls:'status-banned'};
  if(p.tempBanUntil && p.tempBanUntil > Date.now()){
    const d = new Date(p.tempBanUntil);
    return {type:'tempban', label:`Ban temp.`, cls:'status-tempban'};
  }
  return {type:'active', label:'Actif', cls:'status-active'};
}

function renderPlayers(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = allPlayers.filter(p => {
    if(q && !p.pseudo?.toLowerCase().includes(q) && !p.friendCode?.toLowerCase().includes(q) && !p.uid?.toLowerCase().includes(q)) return false;
    const st = getStatus(p);
    if(currentFilter === 'active' && st.type !== 'active') return false;
    if(currentFilter === 'banned' && st.type === 'active') return false;
    return true;
  });

  if(!list.length){
    document.getElementById('playersList').innerHTML = '<div class="loading-state">Aucun joueur trouvé</div>';
    return;
  }

  document.getElementById('playersList').innerHTML = list.map(p => {
    const st = getStatus(p);
    const cards = Object.keys(p.gameState?.collection||{}).length;
    const charges = p.gameState?.charges ?? 0;
    const chargeDots = Array.from({length:MAX_CHARGES},(_,i)=>`<div class="charge-dot${i<charges?' full':''}"></div>`).join('');
    return `
    <div class="player-row${p.banned?' banned':''}" onclick="openPlayerModal('${p.uid}')">
      <div class="player-avatar">${p.avatar||'😀'}</div>
      <div class="player-info">
        <div class="pseudo">${escHtml(p.pseudo||'—')}</div>
        <div class="code">${p.friendCode||'—'}</div>
        <div class="uid">${p.uid?.slice(0,16)}…</div>
      </div>
      <div class="num-cell" style="color:var(--muted)">${p.friendCode||'—'}</div>
      <div class="num-cell">${cards}</div>
      <div class="num-cell">${p.packsOpened||0}</div>
      <div class="num-cell"><div class="charges-display">${chargeDots}</div></div>
      <div><span class="status-badge ${st.cls}">${st.label}</span></div>
      <div class="actions-cell" onclick="event.stopPropagation()">
        <button class="act-btn" onclick="openPlayerModal('${p.uid}')">✏️ Modifier</button>
        ${st.type==='active'
          ? `<button class="act-btn red" onclick="quickBan('${p.uid}')">🚫 Ban</button>`
          : `<button class="act-btn" onclick="quickUnban('${p.uid}')">✅ Unban</button>`}
      </div>
    </div>`;
  }).join('');
}

// ── OPEN PLAYER MODAL ─────────────────────────────────────
function openPlayerModal(uid){
  currentPlayerUid = uid;
  currentPlayerData = allPlayers.find(p=>p.uid===uid);
  if(!currentPlayerData) return;
  const p = currentPlayerData;
  const st = getStatus(p);

  document.getElementById('modalTitle').textContent = `Modifier — ${p.pseudo}`;

  // Build cards state
  const owned = p.gameState?.collection || {};

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-player-header">
      <div class="modal-avatar" id="editAvatarPreview">${p.avatar||'😀'}</div>
      <div>
        <div class="modal-player-name">${escHtml(p.pseudo||'—')}</div>
        <div class="modal-player-meta">${p.uid}<br>${p.friendCode} · ${p.packsOpened||0} boosters ouverts</div>
        <span class="status-badge ${st.cls}" style="margin-top:6px;display:inline-flex">${st.label}</span>
      </div>
    </div>

    <!-- PROFIL -->
    <div class="form-section">
      <div class="form-section-title">Profil</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Pseudo</label>
          <input class="form-input" id="editPseudo" value="${escHtml(p.pseudo||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">Code ami</label>
          <input class="form-input" value="${p.friendCode||''}" disabled style="opacity:.5">
        </div>
      </div>
      <div class="form-section-title" style="margin-top:16px">Avatar</div>
      <div class="avatar-grid" id="editAvatarGrid"></div>
    </div>

    <!-- RECHARGES -->
    <div class="form-section">
      <div class="form-section-title">Recharges</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Recharges actuelles (0–${MAX_CHARGES})</label>
          <input class="form-input" id="editCharges" type="number" min="0" max="${MAX_CHARGES}" value="${p.gameState?.charges??0}">
        </div>
        <div class="form-group">
          <label class="form-label">Boosters ouverts (total)</label>
          <input class="form-input" id="editPacks" type="number" min="0" value="${p.packsOpened||0}">
        </div>
      </div>
    </div>

    <!-- COLLECTION -->
    <div class="form-section">
      <div class="form-section-title">Collection de cartes — Lycée (clic = ajouter/retirer)</div>
      <div class="cards-grid" id="editCardsGrid"></div>
    </div>

    <!-- BAN -->
    <div class="form-section">
      <div class="form-section-title">Sanction</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Type de sanction</label>
          <select class="form-select" id="banType" onchange="toggleBanDuration()">
            <option value="none">Aucune</option>
            <option value="temp" ${st.type==='tempban'?'selected':''}>Ban temporaire</option>
            <option value="def"  ${st.type==='banned' ?'selected':''}>Ban définitif</option>
          </select>
        </div>
        <div class="form-group" id="banDurationGroup" style="display:${st.type==='tempban'?'flex':'none'}">
          <label class="form-label">Durée (jours)</label>
          <input class="form-input" id="banDuration" type="number" min="1" max="365" value="7">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label class="form-label">Raison (visible dans l'historique)</label>
          <textarea class="form-textarea" id="banReason" placeholder="Ex: Triche, comportement toxique…"></textarea>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE -->
    <div class="form-section">
      <div class="form-section-title">Historique des sanctions</div>
      <div class="history-list" id="sanctionHistory">
        ${buildHistory(p.sanctions||[])}
      </div>
    </div>
  `;

  // Fill avatar grid
  const curAv = p.avatar||'😀';
  document.getElementById('editAvatarGrid').innerHTML = AVATARS.map(av =>
    `<div class="avatar-opt${av===curAv?' selected':''}" onclick="selectEditAvatar('${av}')">${av}</div>`
  ).join('');

  // Fill cards grid
  document.getElementById('editCardsGrid').innerHTML = Array.from({length:46},(_,i)=>{
    const num = i+1;
    const id = `Lycee_${num}`;
    const rarity = LYCEE_RARITIES[num]||'basique';
    const isOwned = !!(owned[id]?.count > 0);
    const count = owned[id]?.count||0;
    return `<div class="card-chip${isOwned?' owned':''}" id="chip_${id}" onclick="toggleCard('${id}','${rarity}')">
      <div class="card-chip-num">#${num}</div>
      <div>${RARITY_EMOJI[rarity]}</div>
      <div class="card-chip-rarity">${count>0?'×'+count:''}</div>
    </div>`;
  }).join('');

  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
    <button class="btn btn-save"   onclick="savePlayer()">💾 Sauvegarder</button>
  `;

  document.getElementById('playerModal').classList.add('open');
}

function toggleBanDuration(){
  const t = document.getElementById('banType').value;
  document.getElementById('banDurationGroup').style.display = t==='temp' ? 'flex' : 'none';
}

function selectEditAvatar(av){
  document.querySelectorAll('.avatar-opt').forEach(el => el.classList.toggle('selected', el.textContent===av));
  document.getElementById('editAvatarPreview').textContent = av;
}

// Track card changes locally
let cardChanges = {};
function toggleCard(id, rarity){
  const chip = document.getElementById('chip_'+id);
  const p = currentPlayerData;
  const owned = p.gameState?.collection || {};
  const cur = cardChanges[id] !== undefined ? cardChanges[id] : (owned[id]?.count||0);
  const next = cur > 0 ? 0 : 1;
  cardChanges[id] = next;
  chip.classList.toggle('owned', next > 0);
  chip.querySelector('.card-chip-rarity').textContent = next > 0 ? '×1' : '';
}

// ── SAVE PLAYER ───────────────────────────────────────────
async function savePlayer(){
  const p = currentPlayerData;
  const newPseudo = document.getElementById('editPseudo').value.trim();
  const newAvatar = document.getElementById('editAvatarPreview').textContent;
  const newCharges = Math.min(MAX_CHARGES, Math.max(0, parseInt(document.getElementById('editCharges').value)||0));
  const newPacks = Math.max(0, parseInt(document.getElementById('editPacks').value)||0);
  const banType = document.getElementById('banType').value;
  const banDays = parseInt(document.getElementById('banDuration').value)||7;
  const banReason = document.getElementById('banReason').value.trim();

  if(!newPseudo || newPseudo.length < 2){ showToast('⚠️ Pseudo invalide'); return; }

  // Build updated data
  const updated = JSON.parse(JSON.stringify(p));
  const wasAvatar = updated.avatar;
  const wasPseudo = updated.pseudo;

  updated.pseudo = newPseudo;
  updated.avatar = newAvatar;
  updated.packsOpened = newPacks;
  if(!updated.gameState) updated.gameState = {};
  updated.gameState.charges = newCharges;

  // Apply card changes
  Object.entries(cardChanges).forEach(([id, count]) => {
    if(count > 0){
      if(!updated.gameState.collection) updated.gameState.collection = {};
      updated.gameState.collection[id] = {count, isNew: false};
    } else {
      delete updated.gameState?.collection?.[id];
    }
  });

  // Apply ban
  const now = Date.now();
  const sanctions = updated.sanctions || [];

  if(banType === 'def'){
    updated.banned = true;
    updated.tempBanUntil = null;
    if(banReason) sanctions.push({type:'ban', reason:banReason, date:now, by:'admin'});
  } else if(banType === 'temp'){
    updated.banned = false;
    updated.tempBanUntil = now + banDays * 86400000;
    if(banReason) sanctions.push({type:'tempban', reason:banReason, duration:banDays, date:now, by:'admin'});
  } else {
    if(updated.banned || updated.tempBanUntil){
      sanctions.push({type:'unban', reason: banReason||'Levée de sanction', date:now, by:'admin'});
    }
    updated.banned = false;
    updated.tempBanUntil = null;
  }

  // Log edits
  const edits = [];
  if(wasPseudo !== newPseudo) edits.push(`pseudo: ${wasPseudo} → ${newPseudo}`);
  if(wasAvatar !== newAvatar) edits.push(`avatar: ${wasAvatar} → ${newAvatar}`);
  if(Object.keys(cardChanges).length) edits.push(`${Object.keys(cardChanges).length} carte(s) modifiée(s)`);
  if(edits.length) sanctions.push({type:'edit', reason:edits.join(', '), date:now, by:'admin'});

  updated.sanctions = sanctions;

  try{
    const {uid, ...dataToSave} = updated;
    await db.collection('players').doc(p.uid).set(dataToSave, {merge:false});

    // Update index if pseudo/avatar changed
    if(wasPseudo !== newPseudo || wasAvatar !== newAvatar){
      const ref = db.collection('index').doc('players');
      await db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        const idx = snap.exists ? snap.data() : {codes:{}};
        if(idx.codes?.[p.friendCode]){
          idx.codes[p.friendCode].pseudo = newPseudo;
          idx.codes[p.friendCode].avatar = newAvatar;
          tx.set(ref, idx);
        }
      });
    }

    // Update local state
    const i = allPlayers.findIndex(pl=>pl.uid===p.uid);
    if(i>=0) allPlayers[i] = {...updated, uid:p.uid};
    cardChanges = {};
    closeModal();
    updateStats();
    renderPlayers();
    showToast('✅ Joueur mis à jour !');
  } catch(e){
    showToast('❌ Erreur : '+e.message);
    console.error(e);
  }
}

// ── QUICK BAN / UNBAN ─────────────────────────────────────
async function quickBan(uid){
  const reason = prompt('Raison du ban :');
  if(reason === null) return;
  const p = allPlayers.find(pl=>pl.uid===uid);
  if(!p) return;
  const now = Date.now();
  const sanctions = [...(p.sanctions||[]), {type:'ban', reason:reason||'Aucune raison', date:now, by:'admin'}];
  try{
    await db.collection('players').doc(uid).update({banned:true, tempBanUntil:null, sanctions});
    const i = allPlayers.findIndex(pl=>pl.uid===uid);
    if(i>=0) allPlayers[i] = {...allPlayers[i], banned:true, tempBanUntil:null, sanctions};
    updateStats(); renderPlayers();
    showToast(`🚫 ${p.pseudo} banni`);
  } catch(e){ showToast('❌ Erreur : '+e.message); }
}

async function quickUnban(uid){
  const p = allPlayers.find(pl=>pl.uid===uid);
  if(!p) return;
  const now = Date.now();
  const sanctions = [...(p.sanctions||[]), {type:'unban', reason:'Levée de sanction', date:now, by:'admin'}];
  try{
    await db.collection('players').doc(uid).update({banned:false, tempBanUntil:null, sanctions});
    const i = allPlayers.findIndex(pl=>pl.uid===uid);
    if(i>=0) allPlayers[i] = {...allPlayers[i], banned:false, tempBanUntil:null, sanctions};
    updateStats(); renderPlayers();
    showToast(`✅ ${p.pseudo} débanni`);
  } catch(e){ showToast('❌ Erreur : '+e.message); }
}

// ── HISTORY ───────────────────────────────────────────────
function buildHistory(sanctions){
  if(!sanctions?.length) return '<div style="color:var(--muted);font-family:var(--mono);font-size:12px">Aucun historique</div>';
  return [...sanctions].reverse().map(s => {
    const d = new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const icon = s.type==='ban'?'🚫':s.type==='tempban'?'⏳':s.type==='unban'?'✅':'✏️';
    const label = s.type==='ban'?'Ban définitif':s.type==='tempban'?`Ban temporaire (${s.duration}j)`:s.type==='unban'?'Débannissement':'Modification';
    return `<div class="history-item ${s.type}">
      <strong>${icon} ${label}</strong> — ${escHtml(s.reason||'')}
      <div class="history-date">${d}</div>
    </div>`;
  }).join('');
}

// ── UTILS ─────────────────────────────────────────────────
function closeModal(){
  document.getElementById('playerModal').classList.remove('open');
  cardChanges = {};
  currentPlayerUid = null;
  currentPlayerData = null;
}

let _toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──────────────────────────────────────────────────
checkSession();
</script>
